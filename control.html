<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Control panel · Sue's Angels FC</title>
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#0D0F11" />
<link rel="icon" href="assets/badge/sue-angels-badge-orange.webp" />
<link rel="preload" href="fonts/Archivo-Variable.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="fonts/Geist-Variable.woff2" as="font" type="font/woff2" crossorigin />
<style>
  @font-face { font-family:'Geist'; src:url('fonts/Geist-Variable.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  @font-face { font-family:'Archivo'; src:url('fonts/Archivo-Variable.woff2') format('woff2'); font-weight:100 900; font-stretch:62% 125%; font-display:swap; }
</style>
<link rel="stylesheet" href="control.css?v=6" />
</head>
<body>
<div id="cp-root"></div>

<!-- Tell AdminPanel.jsx not to self-mount: this page supplies its own chrome
     and hosts AdminPanel's section components directly. admin.html sets nothing
     and keeps working exactly as before. -->
<script>window.SA_CONTROL_SHELL = true;</script>

<!-- React from the repo, not a CDN, and the production build rather than the
     development one: the club can still edit the site if unpkg is unreachable,
     and pitch-side on a phone this is ~1.3MB less to download and parse.
     Babel standalone stays on the CDN for now — the 11 .jsx editors are still
     transpiled in the browser (see the note in CLAUDE.md). -->
<script src="react.18.3.1.min.js"></script>
<script src="react-dom.18.3.1.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin></script>

<!-- real data layer + real Supabase auth, shared with the live site -->
<script src="supabase-config.js"></script>
<script src="supabase.js"></script>
<script src="dataStore.js"></script>

<!-- the 11 editor components, unmodified -->
<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="PageShell.jsx"></script>
<script type="text/babel" src="AdminMode.jsx"></script>
<script type="text/babel" src="MediaStore.jsx"></script>
<script type="text/babel" src="TableSync.jsx"></script>
<script type="text/babel" src="MatchEntry.jsx"></script>
<script type="text/babel" src="FixtureEntry.jsx"></script>
<script type="text/babel" src="PlayerPhotos.jsx"></script>
<script type="text/babel" src="GalleryAlbums.jsx"></script>
<script type="text/babel" src="RedesignShell.jsx"></script>
<script type="text/babel" src="AdminPanel.jsx"></script>

<!-- new: competition context + the match-report writer bridge -->
<script src="match-context.js"></script>
<script src="report-writer.js"></script>

<script type="text/babel" src="control-shell.jsx?v=4"></script>
</body>
</html>
