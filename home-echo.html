<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Sue's Angels FC · Champions of League Ten</title>

<!--
  Sue's Angels FC · champions hero (redesign candidate)
  ----------------------------------------------------------------
  Type (all self-hosted, local):
    Mories Display  ->  big display headings (caps)
    Ethereal        ->  body / UI (9 weights)
    Assassin        ->  sparing accent
  Crest:  assets/badge/sue-angels-badge-star.png (Invincibles star, local)
  Hero background: set --hero-photo in :root to your photo, e.g.
    --hero-photo: url('./assets/hero/hero-shirt.jpg');
  Framework libs (React / Tailwind / Babel / Framer Motion) on CDN, as pinned.
  Design language: Modern Dark cinema, glass, ambient light, Expo.out easing.
-->

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          heading: ['"Mories Display"', 'serif'],
          body: ['Ethereal', 'sans-serif'],
          accent: ['Assassin', 'serif'],
        },
        colors: {
          volt: '#F86A1E',
          'volt-soft': '#FF8A3D',
          gold: '#F4BC46',
          ink: '#0a0a0b',
        },
        borderRadius: { DEFAULT: '9999px' },
      },
    },
  };
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>

<style>
  /* ---------- Ethereal (body / UI, 9 weights) ---------- */
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-Thin.otf') format('opentype'); font-weight:100; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-ExtraLight.otf') format('opentype'); font-weight:200; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-Light.otf') format('opentype'); font-weight:300; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-Regular.otf') format('opentype'); font-weight:400; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-Medium.otf') format('opentype'); font-weight:500; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-SemiBold.otf') format('opentype'); font-weight:600; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-Bold.otf') format('opentype'); font-weight:700; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-ExtraBold.otf') format('opentype'); font-weight:800; font-style:normal; font-display:swap; }
  @font-face { font-family:'Ethereal'; src:url('./assets/fonts/ethereal/EtherealDemo-Black.otf') format('opentype'); font-weight:900; font-style:normal; font-display:swap; }

  /* ---------- Mories (display headings) ---------- */
  @font-face { font-family:'Mories Display'; src:url('./assets/fonts/mories/mories-display.otf') format('opentype'); font-weight:100 900; font-style:normal; font-display:swap; }
  @font-face { font-family:'Mories'; src:url('./assets/fonts/mories/mories-text.otf') format('opentype'); font-weight:100 900; font-style:normal; font-display:swap; }

  /* ---------- Assassin (accent only) ---------- */
  @font-face { font-family:'Assassin'; src:url('./assets/fonts/assassin/assassin.ttf') format('truetype'); font-weight:100 900; font-style:normal; font-display:swap; }

  :root {
    /* Hero background photo: the club's orange shirt + embroidered crest */
    --hero-photo: url('./assets/hero/hero-shirt.jpg');
    --volt: #F86A1E;
    --gold: #F4BC46;
  }

  html, body { background:#0a0a0b; overflow-x:hidden; }
  body {
    font-family:'Ethereal', sans-serif;
    color:#fff;
    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;
  }
  ::selection { background: rgba(248,106,30,.35); }
  a { text-decoration:none; }

  /* ---------- background layers ---------- */
  .hero-photo {
    background-image: var(--hero-photo);
    background-size: cover;
    background-position: 70% center;
    background-repeat: no-repeat;
  }
  /* darker on the left (behind the card) + a floor gradient */
  .hero-scrim {
    background:
      linear-gradient(90deg, rgba(8,8,9,.94) 0%, rgba(8,8,9,.78) 30%, rgba(8,8,9,.36) 58%, rgba(8,8,9,.42) 100%),
      linear-gradient(0deg, rgba(8,8,9,.9) 0%, rgba(8,8,9,0) 34%);
  }

  /* ---------- ambient light (moves even offscreen; CSS not JS) ---------- */
  .amb { position:absolute; border-radius:9999px; pointer-events:none; filter:blur(72px); }
  .amb-1 { width:min(46vw,540px); height:min(46vw,540px); left:-6%; top:22%;
    background:radial-gradient(circle, rgba(248,106,30,.55), transparent 68%); opacity:.55;
    animation:drift1 15s ease-in-out infinite; }
  .amb-2 { width:min(38vw,440px); height:min(38vw,440px); left:20%; bottom:-8%;
    background:radial-gradient(circle, rgba(244,188,70,.34), transparent 70%); opacity:.5;
    animation:drift2 19s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(46px,-34px)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-34px,40px)} }

  /* ---------- glass ---------- */
  .liquid-glass {
    background: rgba(255,255,255,0.02);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.1);
    position: relative; overflow: hidden;
  }
  .liquid-glass::before {
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1.2px;
    background:linear-gradient(180deg, rgba(255,255,255,.4) 0%, rgba(255,255,255,.12) 22%, rgba(255,255,255,0) 42%, rgba(255,255,255,0) 60%, rgba(255,255,255,.12) 80%, rgba(255,255,255,.4) 100%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }
  .glass-card {
    position:relative; overflow:hidden;
    background: rgba(16,15,14,0.46);
    backdrop-filter: blur(30px) saturate(1.15); -webkit-backdrop-filter: blur(30px) saturate(1.15);
    border-radius: 30px;
    box-shadow: 0 40px 90px -28px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.14);
  }
  .glass-card::before {
    content:""; position:absolute; inset:0; border-radius:inherit; padding:1.3px;
    background:linear-gradient(150deg, rgba(255,255,255,.42), rgba(255,255,255,.06) 34%, rgba(255,255,255,0) 62%);
    -webkit-mask:linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude; pointer-events:none;
  }

  /* ---------- buttons ---------- */
  .btn { transition: transform .15s cubic-bezier(.16,1,.3,1), filter .2s ease, background-color .2s ease, color .2s ease; cursor:pointer; }
  .btn:hover { filter: brightness(1.06); }
  .btn:active { transform: scale(.97); }

  /* ---------- crest / misc ---------- */
  @keyframes floaty { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }
  .badge-float { animation: floaty 6.5s ease-in-out infinite; filter: drop-shadow(0 10px 30px rgba(248,106,30,.35)); }

  @keyframes cue { 0%,100%{transform:translateY(0); opacity:.5} 50%{transform:translateY(6px); opacity:1} }
  .scroll-cue { animation: cue 2.2s ease-in-out infinite; }

  a:focus-visible, button:focus-visible { outline:2px solid var(--volt); outline-offset:3px; border-radius:4px; }

  @media (prefers-reduced-motion: reduce) {
    .amb, .badge-float, .scroll-cue { animation: none !important; }
  }
</style>
</head>
<body class="bg-ink">
<div id="root"></div>

<script type="text/babel" data-presets="react">
  const _origError = console.error;
  console.error = (...a) => { if (typeof a[0] === 'string' && a[0].includes('key')) return; _origError(...a); };

  const FM = window.Motion || window.FramerMotion || {};
  const motion = FM.motion;
  const EXPO = [0.16, 1, 0.3, 1];

  const BADGE = './assets/badge/sue-angels-badge-star.png';

  /* ------------------------------ icons ------------------------------ */
  const ArrowRight = ({ className }) => (
    <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M5 12h14" /><path d="M13 6l6 6-6 6" />
    </svg>
  );
  const ArrowUpRight = ({ className }) => (
    <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M7 17L17 7" /><path d="M7 7h10v10" />
    </svg>
  );
  const Chevron = ({ className }) => (
    <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
      <path d="M6 9l6 6 6-6" />
    </svg>
  );
  const Star = ({ className }) => (
    <svg className={className} viewBox="0 0 24 24" fill="currentColor">
      <path d="M12 2l2.9 6.26L22 9.27l-5 4.87L18.18 22 12 18.56 5.82 22 7 14.14l-5-4.87 7.1-1.01L12 2z" />
    </svg>
  );
  const HeartIcon = ({ className }) => (
    <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" /></svg>
  );
  const GroupIcon = ({ className }) => (
    <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" /></svg>
  );
  const TrophyIcon = ({ className }) => (
    <svg className={className} viewBox="0 0 24 24" fill="currentColor"><path d="M19 5h-2V3H7v2H5c-1.1 0-2 .9-2 2v1c0 2.55 1.92 4.63 4.39 4.94.63 1.5 1.98 2.63 3.61 2.96V19H7v2h10v-2h-4v-3.1c1.63-.33 2.98-1.46 3.61-2.96C19.08 12.63 21 10.55 21 8V7c0-1.1-.9-2-2-2zM5 8V7h2v3.82C5.84 10.4 5 9.3 5 8zm14 0c0 1.3-.84 2.4-2 2.82V7h2v1z" /></svg>
  );

  /* --------------------------- Navbar --------------------------- */
  function Navbar() {
    const links = [
      { label: 'Home' },
      { label: 'The Club', caret: true },
      { label: 'On The Pitch', caret: true },
      { label: 'Media', caret: true },
      { label: 'Get Involved', caret: true },
    ];
    return (
      <nav className="fixed top-3 left-0 right-0 z-50 px-3 sm:px-5">
        <div className="mx-auto max-w-[1240px] liquid-glass rounded-full pl-3 pr-2 py-2 flex items-center justify-between">
          <a href="#" className="flex items-center gap-2.5 shrink-0">
            <img src={BADGE} alt="Sue's Angels FC crest" className="h-9 w-9 object-contain" />
            <span className="font-body font-bold tracking-[0.14em] text-[15px] text-white">SUE'S ANGELS</span>
          </a>

          <div className="hidden lg:flex items-center gap-1">
            {links.map((l, i) => (
              <a key={i} href="#" className="btn inline-flex items-center gap-1 px-3.5 py-2 rounded-full text-[12px] font-body font-medium tracking-[0.12em] uppercase text-white/70 hover:text-white hover:bg-white/5">
                {l.label}{l.caret && <Chevron className="h-3.5 w-3.5 opacity-60" />}
              </a>
            ))}
          </div>

          <a href="#" className="btn inline-flex items-center gap-1.5 bg-volt text-black rounded-full px-4 sm:px-5 py-2.5 text-[12px] font-body font-bold tracking-[0.12em] uppercase whitespace-nowrap">
            Join <ArrowRight className="h-4 w-4" />
          </a>
        </div>
      </nav>
    );
  }

  /* ----------------------------- Hero ----------------------------- */
  function Hero() {
    const container = { hidden: {}, show: { transition: { staggerChildren: 0.11, delayChildren: 0.15 } } };
    const item = {
      hidden: { opacity: 0, y: 26, filter: 'blur(10px)' },
      show: { opacity: 1, y: 0, filter: 'blur(0px)', transition: { duration: 0.85, ease: EXPO } },
    };
    const stats = [
      { n: '18', l: 'Played' },
      { n: '18', l: 'Won' },
      { n: '0', l: 'Lost' },
      { n: '100%', l: 'Record' },
    ];
    return (
      <section className="relative min-h-screen w-full overflow-hidden bg-ink">
        <div className="hero-photo absolute inset-0 z-0" />
        <div className="hero-scrim absolute inset-0 z-0" />
        <div className="absolute inset-0 z-0 overflow-hidden"><span className="amb amb-1" /><span className="amb amb-2" /></div>

        <div className="relative z-10 min-h-screen flex flex-col">
          <Navbar />

          <div className="flex-1 flex items-center">
            <div className="w-full max-w-[1240px] mx-auto px-4 sm:px-6 pt-28 pb-16">
              <motion.div variants={container} initial="hidden" animate="show"
                className="glass-card max-w-[600px] p-7 sm:p-10">

                {/* eyebrow */}
                <motion.div variants={item} className="flex items-center gap-3 mb-6">
                  <span className="h-px w-8 bg-volt" />
                  <span className="font-body font-semibold text-[11px] sm:text-xs tracking-[0.24em] uppercase text-volt-soft">Southern Sunday Football League</span>
                </motion.div>

                {/* headline */}
                <motion.h1 variants={item} className="font-heading leading-[0.9] tracking-[-1px] text-white text-6xl sm:text-7xl lg:text-[5.4rem]">
                  Sue's Angels <span className="text-volt">FC</span>
                </motion.h1>

                {/* meta */}
                <motion.div variants={item} className="mt-5 flex flex-wrap items-center gap-x-3 gap-y-1 font-body text-sm text-white/75">
                  <span>League Ten</span>
                  <span className="text-white/30">/</span>
                  <span>Season 25/26</span>
                  <span className="text-white/30">/</span>
                  <span className="text-gold font-medium">Champions, Unbeaten</span>
                </motion.div>

                {/* description (no full stops: Ethereal styles them as a ring glyph) */}
                <motion.p variants={item} className="mt-5 font-body font-light text-[15px] sm:text-base leading-relaxed text-white/80 max-w-[46ch]">
                  Founded in memory of Susan Anne Martin, we played eighteen, won eighteen, and were
                  crowned champions of League Ten in our very first season, unbeaten from first whistle to last
                </motion.p>

                {/* CTAs */}
                <motion.div variants={item} className="mt-8 flex flex-wrap items-center gap-3">
                  <a href="#" className="btn inline-flex items-center gap-2 bg-volt text-black rounded-full px-6 py-3.5 text-[12px] font-body font-bold tracking-[0.14em] uppercase">
                    View Fixtures <ArrowRight className="h-4 w-4" />
                  </a>
                  <a href="#" className="btn liquid-glass inline-flex items-center gap-2 rounded-full px-6 py-3.5 text-[12px] font-body font-bold tracking-[0.14em] uppercase text-white">
                    Join The Club
                  </a>
                </motion.div>

                {/* champions stat strip */}
                <motion.div variants={item} className="mt-9 pt-6 border-t border-white/10 flex items-center gap-5 sm:gap-7 flex-wrap">
                  {stats.map((s, i) => (
                    <div key={i} className="flex flex-col">
                      <span className="font-body font-black text-2xl sm:text-3xl text-white leading-none">{s.n}</span>
                      <span className="font-body text-[10px] tracking-[0.18em] uppercase text-white/50 mt-1.5">{s.l}</span>
                    </div>
                  ))}
                  <span className="inline-flex items-center gap-1.5 ml-auto rounded-full px-3 py-1.5 text-[10px] font-body font-bold tracking-[0.16em] uppercase text-gold" style={{ background: 'rgba(244,188,70,.1)', boxShadow: 'inset 0 0 0 1px rgba(244,188,70,.28)' }}>
                    <Star className="h-3 w-3" /> Invincibles
                  </span>
                </motion.div>
              </motion.div>
            </div>
          </div>

          {/* scroll cue */}
          <div className="relative z-10 flex items-center justify-center gap-2 pb-6 text-white/50">
            <span className="scroll-cue"><Chevron className="h-4 w-4" /></span>
            <span className="font-body text-[10px] tracking-[0.3em] uppercase">Scroll</span>
          </div>
        </div>
      </section>
    );
  }

  /* ------------------------- The Club ------------------------- */
  function Pillars() {
    const cards = [
      { Icon: HeartIcon, title: 'The Cause', tags: ['Sepsis Awareness', 'In Memory', 'One Cause'],
        body: 'Every fixture is played in memory of Sue, turning Sunday football into a platform to raise sepsis awareness across South London' },
      { Icon: GroupIcon, title: 'The Squad', tags: ['Grassroots', 'All Welcome', 'Team First'],
        body: 'A tight group who show up for each other every week, and new faces are always welcome, so bring your boots and find your family' },
      { Icon: TrophyIcon, title: 'Matchday', tags: ['League Ten', 'Live Table', 'Player Stats'],
        body: 'Fixtures, results, a live league table and player stats, with the whole season tracked in one place' },
    ];
    return (
      <section className="relative w-full overflow-hidden bg-ink py-24 sm:py-28">
        <div className="absolute inset-0 z-0 overflow-hidden"><span className="amb amb-2" style={{ left: '65%', top: '10%' }} /></div>
        <div className="relative z-10 max-w-[1240px] mx-auto px-4 sm:px-6">
          <div className="flex items-center gap-3 mb-6">
            <span className="h-px w-8 bg-volt" />
            <span className="font-body font-semibold text-xs tracking-[0.24em] uppercase text-volt-soft">The Club</span>
          </div>
          <h2 className="font-heading text-white text-5xl sm:text-6xl lg:text-[5rem] leading-[0.92] tracking-[-1px] max-w-3xl">
            More Than Matchday
          </h2>

          <div className="grid grid-cols-1 md:grid-cols-3 gap-5 mt-14">
            {cards.map((c, i) => (
              <div key={i} className="glass-card p-7 min-h-[320px] flex flex-col">
                <div className="flex items-start justify-between gap-4">
                  <div className="w-12 h-12 rounded-2xl liquid-glass flex items-center justify-center shrink-0">
                    <c.Icon className="h-6 w-6 text-volt-soft" />
                  </div>
                  <div className="flex flex-wrap justify-end gap-1.5 max-w-[72%]">
                    {c.tags.map((t, j) => (
                      <span key={j} className="liquid-glass rounded-full px-3 py-1 text-[10px] tracking-[0.06em] uppercase text-white/80 font-body whitespace-nowrap">{t}</span>
                    ))}
                  </div>
                </div>
                <div className="flex-1" />
                <div className="mt-6">
                  <h3 className="font-heading text-white text-3xl md:text-4xl tracking-[-0.5px] leading-none">{c.title}</h3>
                  <p className="mt-3 font-body font-light text-sm leading-relaxed text-white/70 max-w-[34ch]">{c.body}</p>
                </div>
              </div>
            ))}
          </div>
        </div>
      </section>
    );
  }

  function App() { return (<React.Fragment><Hero /><Pillars /></React.Fragment>); }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
