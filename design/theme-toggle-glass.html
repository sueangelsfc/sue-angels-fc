<!doctype html>
<html lang="en-GB" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sue's Angels FC — Glass theme toggle</title>
<style>
  @font-face{font-family:'Clash Display';src:url('/assets/fonts/clash-display-600.woff2') format('woff2');font-weight:600;font-display:swap}
  @font-face{font-family:'Hanken Grotesk';src:url('/assets/fonts/hanken-500.woff2') format('woff2');font-weight:500;font-display:swap}
  @font-face{font-family:'Hanken Grotesk';src:url('/assets/fonts/hanken-700.woff2') format('woff2');font-weight:700;font-display:swap}
  :root{--volt:#FF6A2A;--disp:'Clash Display',system-ui,sans-serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
  html[data-theme="dark"]{--bg:#04121B;--ink:#fff;--mut:rgba(233,242,247,.72);--glass:rgba(255,255,255,.07);--glass-2:rgba(255,255,255,.16);--edge:rgba(255,255,255,.16);--hi:rgba(255,255,255,.34);--seg:rgba(255,255,255,.55);--glow:rgba(255,255,255,.45);--cardbg:rgba(255,255,255,.05)}
  html[data-theme="light"]{--bg:#EAEEF2;--ink:#07131D;--mut:rgba(20,38,52,.78);--glass:rgba(255,255,255,.55);--glass-2:rgba(255,255,255,.92);--edge:rgba(8,22,32,.14);--hi:rgba(255,255,255,.9);--seg:rgba(40,60,75,.6);--glow:rgba(255,255,255,.9);--cardbg:rgba(255,255,255,.7)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:42px;padding:40px;transition:background .5s ease,color .5s ease}

  /* ── the glass theme toggle ───────────────────────────────── */
  .themebar{position:relative;display:inline-flex;gap:4px;padding:5px;border-radius:999px;
    background:var(--glass);backdrop-filter:blur(18px) saturate(1.3);-webkit-backdrop-filter:blur(18px) saturate(1.3);
    border:1px solid var(--edge);
    box-shadow:inset 0 1px 0 var(--hi), inset 0 -10px 18px -10px var(--hi), 0 14px 34px -14px rgba(0,0,0,.5)}
  .themebar::after{content:'';position:absolute;left:18%;right:18%;bottom:-10px;height:16px;border-radius:50%;
    background:var(--glow);filter:blur(11px);opacity:.6;z-index:-1}
  .seg{position:relative;z-index:1;width:54px;height:42px;border:0;background:transparent;border-radius:999px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--seg);transition:color .35s}
  .seg svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .seg.on{color:#071D29}
  .thumb{position:absolute;top:5px;left:5px;width:54px;height:42px;border-radius:999px;z-index:0;
    background:var(--volt);
    box-shadow:0 3px 12px -2px rgba(255, 106, 42,.5), inset 0 1px 0 rgba(255,255,255,.5);
    transition:transform .4s cubic-bezier(.16,1,.3,1)}
  html[data-theme="dark"] .thumb{transform:translateX(58px)}
  html[data-theme="light"] .thumb{transform:translateX(0)}

  .lbl{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:700}

  /* tiny demo so you see both modes */
  .demo{display:flex;flex-direction:column;align-items:center;gap:18px;padding:30px 34px;border-radius:26px;
    background:var(--cardbg);border:1px solid var(--edge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    box-shadow:inset 0 1px 0 var(--hi),0 30px 70px -34px rgba(0,0,0,.6);max-width:440px;text-align:center;transition:background .5s,border-color .5s}
  .demo .eb{display:flex;align-items:center;gap:9px;justify-content:center}
  .demo .eb span{width:24px;height:2px;background:var(--volt)}
  .demo .eb b{color:var(--volt);font-weight:700;font-size:10px;letter-spacing:.24em;text-transform:uppercase}
  .demo h1{font-family:var(--disp);font-weight:600;text-transform:uppercase;letter-spacing:-.02em;line-height:.9;font-size:42px}
  .demo h1 em{font-style:normal;color:var(--volt)}
  .demo p{color:var(--mut);font-size:14px;line-height:1.6}
  .demo .btn{display:inline-flex;align-items:center;gap:8px;background:var(--volt);color:#071D29;font-weight:700;font-size:14px;padding:11px 22px;border-radius:999px;border:0;cursor:pointer}
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;align-items:center;gap:16px">
    <div class="lbl">Appearance</div>
    <div class="themebar" role="group" aria-label="Theme">
      <span class="thumb" aria-hidden="true"></span>
      <button class="seg" id="seg-light" aria-label="Light mode">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5L19 19M5 19l1.5-1.5M17.5 6.5L19 5"/></svg>
      </button>
      <button class="seg" id="seg-dark" aria-label="Dark mode">
        <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </div>
  </div>

  <div class="demo">
    <div class="eb"><span></span><b>Built in memory. Driven by purpose.</b></div>
    <h1>Sue's Angels <em>FC</em></h1>
    <p>Toggle the glass switch above. The whole site flips between dark and light, frosted glass and all.</p>
    <button class="btn">Join the club</button>
  </div>

<script>
  var root=document.documentElement;
  function setTheme(t){root.setAttribute('data-theme',t);
    document.getElementById('seg-dark').classList.toggle('on',t==='dark');
    document.getElementById('seg-light').classList.toggle('on',t==='light');
    try{localStorage.setItem('sa-theme',t)}catch(e){}}
  document.getElementById('seg-dark').onclick=function(){setTheme('dark')};
  document.getElementById('seg-light').onclick=function(){setTheme('light')};
  setTheme((function(){try{return localStorage.getItem('sa-theme')||'dark'}catch(e){return 'dark'}})());
</script>
</body>
</html>
