<script>
(function () {
  'use strict';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  // Boot: fade out once loaded (min hold for polish), safety timeout
  var boot = document.getElementById('boot');
  function hideBoot() { if (boot && !boot.classList.contains('hide')) { boot.classList.add('hide'); setTimeout(function () { if (boot && boot.parentNode) boot.parentNode.removeChild(boot); }, 900); } }
  window.addEventListener('load', function () { setTimeout(hideBoot, reduce ? 400 : 2200); });
  setTimeout(hideBoot, 5500);
  // Scroll progress bar
  var bar = document.getElementById('scrollbar');
  function onScroll() { var st = window.scrollY || document.documentElement.scrollTop; var h = document.documentElement.scrollHeight - window.innerHeight; if (bar) bar.style.width = (h > 0 ? (st / h) * 100 : 0) + '%'; }
  window.addEventListener('scroll', onScroll, { passive: true }); onScroll();
  // Custom cursor (fine pointers only)
  if (!reduce && window.matchMedia && window.matchMedia('(pointer: fine)').matches) {
    document.documentElement.classList.add('has-cursor');
    var dot = document.createElement('div'); dot.className = 'cur-dot';
    var ring = document.createElement('div'); ring.className = 'cur-ring';
    document.body.appendChild(dot); document.body.appendChild(ring);
    var mx = -100, my = -100, rx = -100, ry = -100, raf;
    window.addEventListener('mousemove', function (e) { mx = e.clientX; my = e.clientY; dot.style.transform = 'translate(' + mx + 'px,' + my + 'px)'; }, { passive: true });
    (function loop() { rx += (mx - rx) * 0.18; ry += (my - ry) * 0.18; ring.style.transform = 'translate(' + rx.toFixed(1) + 'px,' + ry.toFixed(1) + 'px)'; raf = requestAnimationFrame(loop); })();
    document.addEventListener('mouseover', function (e) { if (e.target.closest && e.target.closest('a,button,[role="button"],.aw-card,input,textarea')) ring.classList.add('big'); });
    document.addEventListener('mouseout', function (e) { if (e.target.closest && e.target.closest('a,button,[role="button"],.aw-card,input,textarea')) ring.classList.remove('big'); });
  }
})();
